<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:">
  <title>Steal A Fish — Game</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0C2B40; }
    body { font-family: "Mitr", "Noto Sans Thai", system-ui, sans-serif; color: #fff; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; gap: 8px; }
    #title { font-size: 30px; font-weight: 700; color: #FFC23D; letter-spacing: 1px; text-shadow: 0 2px 0 #0008; }
    #pond { font-size: 14px; color: #9FE3E6; }
    #feed { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
    .item { background: #071C29E6; border: 2px solid #2D6E84; border-radius: 12px; padding: 8px 12px; font-size: 14px; animation: in .25s ease-out; }
    .item b { color: #FFC23D; font-weight: 600; }
    #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #071C29CC; border: 2px solid #2D6E84; }
    .tag.host { color: #FFC23D; border-color: #FFC23D; }
    .tag.focus { font-size: 16px; padding: 4px 12px; border-color: #FFFFFF; z-index: 1; }
    .tag.champion::before { content: "👑 "; }
    .tag.champion { color: #2A1A00; background: linear-gradient(#FFE07A, #FFB52E); border-color: #FFF3B0; box-shadow: 0 0 10px #FFC23D99; }
    @keyframes in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="tags"></div>
  <div id="hud">
    <div id="title"></div>
    <div id="pond"></div>
    <div id="feed"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
