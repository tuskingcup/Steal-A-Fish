<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:">
  <title>Fishing Tok</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0C2B40; }
    body { font-family: "Mitr", "Noto Sans Thai", system-ui, sans-serif; color: #fff; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; gap: 8px; }
    #feed { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
    .item { background: #071C29E6; border: 2px solid #2D6E84; border-radius: 12px; padding: 8px 12px; font-size: 14px; animation: in .25s ease-out; }
    .item b { color: #FFC23D; font-weight: 600; }
    #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    /* Name tag: the player's round points above a name pill. */
    .tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; }
    .tag .pts { font-size: 12px; font-weight: 800; color: #FFD866; padding: 0 6px; border-radius: 999px; background: #071C29B3; text-shadow: 0 1px 0 #000a; }
    .tag .nm { max-width: 140px; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #071C29CC; border: 2px solid #2D6E84; }
    .tag.host .nm { color: #FFC23D; border-color: #FFC23D; }
    .tag.focus { z-index: 1; }
    .tag.focus .nm { font-size: 16px; padding: 4px 12px; border-color: #FFFFFF; }
    .tag.focus .pts { font-size: 15px; }
    .tag.champion .nm::before { content: "👑 "; }
    .tag.champion .nm { color: #2A1A00; background: linear-gradient(#FFE07A, #FFB52E); border-color: #FFF3B0; box-shadow: 0 0 10px #FFC23D99; }
    /* Points popping up over a catcher's head. */
    .pop { position: absolute; left: 0; top: 0; font-size: 18px; font-weight: 900; color: #FFE27A; white-space: nowrap; pointer-events: none; text-shadow: 0 2px 0 #0009, 0 0 6px #000a; z-index: 2; }
    .pop.big { font-size: 26px; color: var(--rc, #FFE27A); text-shadow: 0 2px 0 #000b, 0 0 12px var(--rc, #FFC23D); }
    .pop.steal { color: #7CFFB0; text-shadow: 0 2px 0 #000b, 0 0 12px #2BD27A; }
    .pop.robbed { color: #FF6B6B; text-shadow: 0 2px 0 #000b, 0 0 12px #FF3B3B; }
    /* Rarity colours (shared by feed, cards, summary). */
    .r-common { --rc: #C9D1D9; } .r-uncommon { --rc: #6FD08C; } .r-rare { --rc: #4FA3FF; }
    .r-epic { --rc: #B47CFF; } .r-legendary { --rc: #FFB52E; } .r-mythic { --rc: #FF5C8A; }
    .rarity { color: var(--rc); font-weight: 700; }
    .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--rc); color: #10141A; vertical-align: middle; }

    #roundbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
    #roundbar .pill { background: #071C29D9; border: 2px solid #2D6E84; border-radius: 999px; padding: 3px 12px; font-weight: 600; }
    #roundbar .clock { color: #FFC23D; font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: center; }
    #roundbar .clock.low { color: #FF5C5C; }

    #card { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); width: 82%; max-width: 440px; text-align: center; pointer-events: none;
      background: #071C29F0; border: 3px solid var(--rc); border-radius: 18px; padding: 14px 16px 16px; box-shadow: 0 0 28px var(--rc); display: none; }
    #card.show { display: block; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
    #card .who { font-size: 15px; color: #9FE3E6; }
    /* The catcher's name is as big as the fish's name. */
    #card .catcher, #reveal .catcher { font-size: 26px; font-weight: 800; color: #FFFFFF; text-shadow: 0 2px 0 #0009; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #card .name { font-size: 26px; font-weight: 800; margin: 4px 0; color: var(--rc); }
    /* Points are the headline; weight is a detail. */
    #card .points, #reveal .points { font-size: 38px; font-weight: 900; color: #FFD866; text-shadow: 0 2px 0 #0009, 0 0 14px #FFC23D88; line-height: 1.15; }
    #card .weight { font-size: 15px; font-weight: 600; color: #CFE8EE; }
    #card .best { color: #FFC23D; font-weight: 700; font-size: 14px; }
    #card .price { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .coin { color: #FFD866; font-weight: 700; white-space: nowrap; }
    @keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

    #summary { position: fixed; inset: 124px 12px 12px; display: none; flex-direction: column; gap: 10px; pointer-events: none; }
    #summary.show { display: flex; }
    #summary .panel { background: #071C29E0; border: 2px solid #2D6E84; border-radius: 14px; padding: 8px 14px; }
    #summary h2 { margin: 0 0 4px; font-size: 20px; color: #FFC23D; }
    #summary .podium div { display: flex; gap: 8px; align-items: baseline; font-size: 14px; padding: 1px 0; }
    #summary .podium .medal { width: 1.6em; }
    #summary .podium .pname { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #summary .browser { margin-top: auto; }
    #summary .bhead { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; }
    #summary .bhead .bname { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #summary .arrow { color: #FFC23D; font-size: 22px; }
    #summary .stats { font-size: 13px; color: #9FE3E6; text-align: center; margin: 2px 0 6px; }
    #summary .exfish { text-align: center; padding: 4px 0 2px; border-top: 1px solid #2D6E8455; }
    #summary .exname { font-size: 22px; font-weight: 800; text-shadow: 0 2px 6px #000A; }
    #summary .exnums { display: flex; justify-content: center; gap: 14px; font-size: 13px; color: #CFE8EE; margin-top: 2px; }
    #summary .exprice { font-size: 26px; font-weight: 900; color: #FFD866; text-shadow: 0 2px 0 #0009; margin-top: 2px; }
    #summary .exprice small { color: #9FE3E6; font-size: 12px; font-weight: 400; margin-left: 10px; }
    #summary .hint { font-size: 12px; color: #9FE3E6; text-align: center; margin-top: 4px; }
    #summary .nextbtn { pointer-events: auto; align-self: center; margin-top: 2px; font: inherit; font-size: 20px; font-weight: 900; letter-spacing: 1px;
      color: #3A2500; background: linear-gradient(#FFE07A, #FFB52E); border: 3px solid #FFF3C4; border-radius: 999px; padding: 8px 28px; cursor: pointer;
      box-shadow: 0 4px 0 #A8640E, 0 0 22px #FFC23D88; animation: glow 1.6s ease-in-out infinite; }
    #summary .nextbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #A8640E; }
    #summary .nextkey { text-align: center; font-size: 12px; color: #CFE8EE; text-shadow: 0 1px 2px #000; }
    body.in-summary #feed { display: none; }

    /* Title screen: shown when the game window opens, over the live bay. */
    #title { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      background: linear-gradient(180deg, #0C2B4000 0%, #0C2B4055 45%, #061722E6 100%); }
    body.on-title #title { display: flex; }
    body.on-title #hud, body.on-title #tags, body.on-title #card { display: none; }
    #title .logo { animation: bob 3.2s ease-in-out infinite; margin-top: -10vh; }
    #title .hook { font-size: 54px; filter: drop-shadow(0 4px 0 #0008); }
    #title .name { font-size: 76px; font-weight: 900; line-height: .95; letter-spacing: 1px; color: #FFFFFF;
      text-shadow: 0 5px 0 #0E4E6E, 0 9px 0 #06263A, 0 0 30px #5FE3FFAA; }
    #title .name .tok { display: inline-block; color: #FFC23D; transform: rotate(-6deg); text-shadow: 0 5px 0 #A8640E, 0 9px 0 #5A3204, 0 0 30px #FFC23D99; }
    #title .startbtn { margin-top: 9vh; font: inherit; font-size: 34px; font-weight: 900; letter-spacing: 6px; color: #3A2500; cursor: pointer;
      background: linear-gradient(#FFE07A, #FFB52E); border: 4px solid #FFF3C4; border-radius: 999px; padding: 12px 56px 12px 62px;
      box-shadow: 0 6px 0 #A8640E, 0 0 34px #FFC23D99; animation: glow 1.6s ease-in-out infinite; }
    #title .startbtn:hover { filter: brightness(1.08); }
    #title .startbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #A8640E; }
    #title .credit { position: absolute; bottom: 22px; left: 0; right: 0; font-size: 14px; letter-spacing: 1px; color: #CFE8EECC; text-shadow: 0 1px 3px #000; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 6px 0 #A8640E, 0 0 18px #FFC23D66; } 50% { box-shadow: 0 6px 0 #A8640E, 0 0 40px #FFC23DDD; } }

    /* Big-catch reveal */
    body.revealing #feed, body.revealing #tags, body.revealing #card { display: none; }
    body.exhibiting #tags, body.exhibiting #card { display: none; }
    #reveal { position: fixed; left: 50%; transform: translateX(-50%); width: 86%; max-width: 460px; text-align: center; pointer-events: none; display: none; }
    #reveal.hook { display: block; top: 30%; animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
    #reveal.hook .big { font-size: 64px; font-weight: 900; color: #FFC23D; text-shadow: 0 4px 0 #0009, 0 0 24px var(--rc); letter-spacing: 2px; }
    #reveal.hook .who { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 #000a; }
    #reveal.stage, #reveal.info { display: block; bottom: 28px; background: #071C29E8; border: 3px solid var(--rc); border-radius: 18px; padding: 12px 16px; box-shadow: 0 0 30px var(--rc); }
    #reveal.info { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
    #reveal .who { font-size: 16px; color: #9FE3E6; }
    #reveal .name { font-size: 26px; font-weight: 800; color: var(--rc); margin: 2px 0; }
    #reveal .len { font-size: 15px; font-weight: 600; color: #CFE8EE; }
    #reveal .price { font-size: 17px; font-weight: 700; margin-top: 2px; }
    #reveal .fact { font-size: 14px; color: #CFE0FF; margin-top: 4px; }
    #reveal.cosmic { display: block; top: 16%; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
    #reveal.cosmic .big { font-size: 46px; font-weight: 900; color: #FFFFFF; text-shadow: 0 0 18px var(--rc), 0 0 40px var(--rc), 0 4px 0 #0009; }
    #reveal.cosmic .who { font-size: 20px; font-weight: 700; text-shadow: 0 2px 0 #000a; }
    #revealLabels { position: fixed; inset: 0; pointer-events: none; }
    .reflabel { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: #FFFFFFE6; color: #10202A; white-space: nowrap; }
    #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #flash.go { animation: flash .5s ease-out; }
    @keyframes flash { from { opacity: .95; } to { opacity: 0; } }

    @keyframes in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body class="on-title">
  <canvas id="scene"></canvas>
  <div id="tags"></div>
  <div id="card"></div>
  <div id="summary"></div>
  <div id="revealLabels"></div>
  <div id="reveal"></div>
  <div id="flash"></div>
  <div id="title"></div>
  <div id="hud">
    <div id="roundbar"></div>
    <div id="feed"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
