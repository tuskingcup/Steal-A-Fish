appId: com.tuskingcup.stealafish
productName: Steal A Fish
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # Plain zip of the app: needs no Wine, so it can be built on a Mac too (pnpm dist:win-zip).
    - target: zip
      arch: [x64]
  # The zip's name; nsis and portable set their own below.
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.games
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Unsigned until an Apple Developer ID is set up; users must right-click → Open.
  identity: null
linux:
  target: [AppImage]
publish: null
